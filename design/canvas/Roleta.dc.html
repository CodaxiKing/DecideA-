<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Girar a roleta</title><script src="./support.js"></script><link rel="stylesheet" href="./app.css"></head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></helmet>
<main class="s">
  <div class="row sb">
    <a class="ib" href="Roletas.dc.html" aria-label="Voltar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="d t3">O que comer?</h1>
    <a class="ib" href="RoletaEditor.dc.html" aria-label="Editar roleta"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"></path></svg></a>
  </div>
  <div style="position:relative;width:350px;height:374px">
    <div style="position:absolute;left:159px;top:0;z-index:2"><div class="pin"></div></div>
    <div style="position:absolute;left:15px;top:22px;width:320px;height:320px;transform:rotate({{rot}}deg);transition:{{tr}}">
      <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Roleta com seis opções de comida" style="font:700 19px Figtree,sans-serif">
        <path d="M160 160L80 21.44A160 160 0 0 1 240 21.44Z" fill="#5A2BE0"></path>
        <path d="M160 160L240 21.44A160 160 0 0 1 320 160Z" fill="#B9A2FF"></path>
        <path d="M160 160L320 160A160 160 0 0 1 240 298.56Z" fill="#2159DB"></path>
        <path d="M160 160L240 298.56A160 160 0 0 1 80 298.56Z" fill="#C9DCFF"></path>
        <path d="M160 160L80 298.56A160 160 0 0 1 0 160Z" fill="#1B1036"></path>
        <path d="M160 160L0 160A160 160 0 0 1 80 21.44Z" fill="#8E6CF5"></path>
        <text x="160" y="58" text-anchor="middle" fill="#fff">Pizza</text>
        <text x="160" y="58" text-anchor="middle" fill="#1B1036" transform="rotate(60 160 160)">Sushi</text>
        <text x="160" y="58" text-anchor="middle" fill="#fff" transform="rotate(120 160 160)">Massa</text>
        <text x="160" y="58" text-anchor="middle" fill="#1B1036" transform="rotate(180 160 160)">Lanche</text>
        <text x="160" y="58" text-anchor="middle" fill="#fff" transform="rotate(240 160 160)">Salada</text>
        <text x="160" y="58" text-anchor="middle" fill="#1B1036" transform="rotate(300 160 160)">Tapioca</text>
        <circle cx="160" cy="160" r="30" fill="#fff"></circle>
      </svg>
    </div>
  </div>
  <div class="c" style="min-height:92px" aria-live="polite">
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><p class="m sm">Deu</p><p class="d" style="font-size:44px">{{winner}}</p></sc-if>
    <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><p class="m">Seis opções, uma decisão.</p></sc-if>
    <sc-if value="{{spinning}}" hint-placeholder-val="{{ false }}"><p class="d t2">Girando…</p></sc-if>
  </div>
  <div class="foot">
    <button class="btn w" onClick="{{spin}}" disabled="{{spinning}}">{{label}}</button>
    <div class="row sb sm"><span class="row g8"><button class="sw on" aria-label="Vibração ligada"></button>Vibrar</span><span class="row g8"><button class="sw" aria-label="Som desligado"></button>Som</span><a class="link" href="Historico.dc.html">Histórico</a></div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { rot: 0, spinning: false, idx: -1 };
  componentWillUnmount() { clearTimeout(this.t); }
  spin = () => {
    if (this.state.spinning) return;
    const n = 6, idx = Math.floor(Math.random() * n);
    const jitter = Math.random() * 40 - 20;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // o setor idx fica sob o ponteiro quando a rotação vale -idx*60 (mod 360)
    const rot = (Math.ceil(this.state.rot / 360) + 5) * 360 - idx * 60 + jitter;
    this.setState({ rot, spinning: true, idx: -1 });
    this.t = setTimeout(() => this.setState({ spinning: false, idx }), reduce ? 50 : 4100);
  };
  renderVals() {
    const o = ['Pizza', 'Sushi', 'Massa', 'Lanche', 'Salada', 'Tapioca'];
    const { rot, spinning, idx } = this.state;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return {
      rot, spinning, spin: this.spin,
      tr: reduce ? 'none' : 'transform 4s cubic-bezier(.12,.72,.1,1)',
      done: !spinning && idx >= 0, idle: !spinning && idx < 0,
      winner: idx >= 0 ? o[idx] : '',
      label: spinning ? 'Girando…' : idx >= 0 ? 'Girar de novo' : 'Girar'
    };
  }
}
</script>
</body>
</html>
